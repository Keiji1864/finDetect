spring.application.name=findetect-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/findetect}
spring.datasource.username=${DB_USER:findetect}
spring.datasource.password=${DB_PASSWORD:findetect_local}
spring.sql.init.mode=always
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
